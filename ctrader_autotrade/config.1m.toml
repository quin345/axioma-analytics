# The 1-minute instance "ax1m" (DESIGN.md section 3 "Instances", README "Second bot").
# Run with:  autotrade --config config.1m.toml run --mode demo
# Same .env (account, token) as the 5-minute bot; secrets never go here.
#
# Strategy: the 1-minute screen's analog of the 5-minute bot (docs/findings-1m-screen.md):
# z = rolling z (60 one-minute bars, min_periods 15) of poc_reversion_1h = -poc_dist_60, enter when
# |z| > 1, hold ONE 1-minute bar, half size when events_z > 2, range_reversal_12m journalled only.
# Expected P&L is negative (research holdout taker net -0.84 bp/trade): a forward test of the signal.
symbols = ["XAUUSD", "BTCUSD"]
host = "demo.ctraderapi.com"
port = 5035
state_dir = "state/ax1m"   # own journal, KILL/PAUSE/PARITY_OK, kill baseline, risk counters
log_dir = "logs/ax1m"

[instance]
name = "ax1m"              # cTrader label on every order (so on its positions) and clientOrderId prefix
timeframe = "1m"           # 1-minute bars, 60 min POC window, z over 60 bars
# never set claim_unlabelled or the 5-minute bot's labels here: config validation refuses them

[aliases]
XAUUSD = ["XAUUSD.pro", "GOLD"]
BTCUSD = ["BTCUSD.pro", "BITCOIN"]

[strategy]
entry_z = 1.0
vol_shrink_z = 2.0
confirm_range = "off"
exec = "taker"
limit_ttl_s = 45           # maker shadow / maker orders: inside one 60 s slot (5m bot: 120)
rollover_same_side = true
exit_mode = "taker"
stop_k = 4.0               # stop = max(4 x per-1-minute sigma, 3 x spread, broker min): ~1/sqrt(5) of the 5m stop
grace_s = 2
warmup_hours = 3           # computed minimum: 120 bars x 1 min + 60 min VAP window = 3 h

[risk]
base_size_x_min = 2
max_positions = 2          # this instance's own positions (one per symbol)
max_trades_day = 1000      # 5x the 5m bot's 200: five times as many bars (|z| > 1 on ~1/3 of them)
max_orders_min = 10
daily_loss_pct = 1.0
daily_loss_bps = 1000      # sum of per-trade bp; at the research -0.84 bp/trade, 150 (5m value) would latch
                           # after ~180 trades every day
max_consec_losses = 15
pause_after_losses_min = 60
no_entry_before_close_min = 10
flat_before_close_min = 2
spread_guard_x_median = 2.0  # x the median spread over one z-window (60 one-minute bars)
stale_s = 30
reject_breaker = [3, 10]
flatten_after_disconnect_s = 120
close_on_shutdown = true
daily_reset = "00:00"
daily_reset_tz = "UTC"

[data]                     # 1-minute decision budget (DESIGN.md section 4): decide by slot_end + 6 s at worst
source = "kql"
env_file = "../.env"
grace_s = 2                # first query 2 s after the slot end (ingestion < 1 s; the 5m bot uses 3)
retry_s = 1
retries = 4
deadline_s = 6             # < strategy grace_s + 10 s backstop (12 s), far inside the 60 s slot
timeout_s = 5
freshness_s = 5            # 5m bot: 15 s. A 15 s lag would be a quarter of a 1-minute bar's close
gap_max_s = 30             # more than 3 consecutive missing 10 s buckets in the 60 min VAP window (open session)
                           # = gap. Measured 2026-11-20 05:30-12:10 UTC on account 48664595: 0 missing buckets

[kill]                     # this instance's own P&L only (its journal, its labelled positions)
enabled = true
max_loss = 500
profit_target = 1000
profit_action = "kill"
daily_max_loss = 200
check_interval_s = 5
