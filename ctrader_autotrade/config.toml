# Non-secret settings (secrets live in .env). Defaults from DESIGN.md sections 2 and 5.
symbols = ["XAUUSD", "BTCUSD"]
host = "demo.ctraderapi.com"
port = 5035
label = "axq-poc4h-v1"
state_dir = "state"
log_dir = "logs"

[aliases]
XAUUSD = ["XAUUSD.pro", "GOLD"]
BTCUSD = ["BTCUSD.pro", "BITCOIN"]

[strategy]
entry_z = 1.0
vol_shrink_z = 2.0
confirm_range = "off"
exec = "taker"
limit_ttl_s = 120
rollover_same_side = true
exit_mode = "taker"
stop_k = 4.0
grace_s = 2
warmup_hours = 9

[risk]
base_size_x_min = 2
max_positions = 2
max_trades_day = 200
max_orders_min = 10
daily_loss_pct = 1.0
daily_loss_bps = 150
max_consec_losses = 15
pause_after_losses_min = 60
no_entry_before_close_min = 10
flat_before_close_min = 2
spread_guard_x_median = 2.0
stale_s = 30
reject_breaker = [3, 10]   # rejects, window in minutes
flatten_after_disconnect_s = 120
close_on_shutdown = true
daily_reset = "00:00"      # HH:MM local time in daily_reset_tz: where every "day" (loss latch, trades_today, ...) starts
daily_reset_tz = "UTC"     # IANA name, e.g. "America/New_York" with "17:00" for the forex day

[kill]                     # P&L kill switch; amounts in the account currency (positive numbers)
enabled = true
max_loss = 500             # cumulative P&L since the baseline <= -max_loss: flatten, write state/KILL, stop (exit 0)
profit_target = 1000       # cumulative P&L since the baseline >= profit_target: profit_action; 0 = off
profit_action = "kill"     # "kill" = as max_loss; "pause" = no new entries (writes state/PAUSE), exits continue
daily_max_loss = 200       # P&L since the last daily reset <= -daily_max_loss: flatten, no entries until the next reset; 0 = off
check_interval_s = 5
# since = "2026-11-20T05:00:00Z"   # optional: overrides state/kill_baseline.json (see `autotrade kill-reset`)
