<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Order Book Monitor</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; }
    .controls { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
    #status { color: #666; margin-left: auto; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .chart-box { height: 260px; }
    table { border-collapse: collapse; }
    th, td { padding: 4px 12px; text-align: right; }
    tr.ask td { color: #c0392b; }
    tr.bid td { color: #27ae60; }
  </style>
</head>
<body>
  <div class="controls">
    <label>Symbol <select id="symbol"></select></label>
    <label>Window (min) <input id="minutes" type="number" value="60" min="1" max="1440"></label>
    <span id="status"></span>
  </div>

  <div class="grid">
    <div class="chart-box"><canvas id="priceChart"></canvas></div>
    <div class="chart-box"><canvas id="spreadChart"></canvas></div>
    <div class="chart-box"><canvas id="eventsChart"></canvas></div>
    <div>
      <table id="book">
        <thead><tr><th>Side</th><th>Price</th><th>Volume</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
