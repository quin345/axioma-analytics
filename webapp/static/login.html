<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Sign in &middot; AXIOMA</title>
<link rel="icon" href="/favicon.png" />
<meta name="theme-color" content="#0b0e12" />
<!--
  Self-contained on purpose: this is the only page a signed-out visitor can
  load, so it must not depend on the landing or terminal bundles. All styling
  and script is inline.
-->
<style>
:root{
  --bg:#0b0e12; --panel:#11161d; --card:#151b24; --line:#29323d;
  --fg:#e7edf3; --muted:#94a3b3; --dim:#647587; --accent:#79d9ee; --err:#f0716a;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 "Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;flex-direction:column;min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.wrap{flex:1;display:grid;place-items:center;padding:32px 16px}
.card{
  width:100%;max-width:380px;
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:34px 28px 28px;
}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:26px}
.logo{width:56px;height:56px;display:block;
  filter:drop-shadow(0 6px 22px rgba(121,217,238,.20))}
.brand h1{font-size:20px;margin:0;letter-spacing:.12em}
.brand .sub{margin:0;color:var(--dim);font-size:12px}
label{display:block;margin:0 0 14px;font-size:12.5px;color:var(--muted)}
input{
  display:block;width:100%;margin-top:6px;padding:10px 12px;
  background:var(--panel);color:var(--fg);border:1px solid var(--line);
  border-radius:8px;font:inherit;font-size:16px;
}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
button{
  width:100%;margin-top:6px;padding:11px 20px;border-radius:8px;font-size:14px;
  font-weight:600;cursor:pointer;border:1px solid transparent;font-family:inherit;
  background:var(--accent);color:#04101f;
}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.6;cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.error{min-height:20px;margin:0 0 10px;color:var(--err);font-size:12.5px}
footer{padding:16px;border-top:1px solid var(--line);background:var(--panel);
  color:var(--dim);font-size:12px;text-align:center}
@media (max-width:420px){
  .card{padding:26px 18px 22px}
}
</style>
</head>
<body>

<main class="wrap">
  <form class="card" id="form" autocomplete="on">
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40" role="img" aria-label="AXIOMA logo">
        <title>AXIOMA</title>
        <path d="M20 3 L33 20 L20 37 L7 20 Z" fill="none"
              stroke="url(#ax-g)" stroke-width="2.5" stroke-linejoin="round" />
        <path d="M14 25 L14 19 M20 25 L20 14" fill="none"
              stroke="url(#ax-g)" stroke-width="3" stroke-linecap="round" />
        <defs>
          <linearGradient id="ax-g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4f9dff" />
            <stop offset="100%" stop-color="#22d3a7" />
          </linearGradient>
        </defs>
      </svg>
      <h1>AXIOMA</h1>
      <p class="sub">Sign in to continue</p>
    </div>

    <label>Username
      <input id="username" name="username" type="text" autocomplete="username"
             autocapitalize="none" spellcheck="false" required autofocus />
    </label>
    <label>Password
      <input id="password" name="password" type="password"
             autocomplete="current-password" required />
    </label>
    <p class="error" id="error" role="alert" aria-live="polite"></p>
    <button type="submit" id="submit">Sign in</button>
  </form>
</main>

<footer>AXIOMA Analytics</footer>

<script>
(function () {
  "use strict";
  var form = document.getElementById("form");
  var button = document.getElementById("submit");
  var errorLine = document.getElementById("error");

  // Where to go after signing in: a same-site path only, else the landing page.
  // The server applies the same rule to /login?next=.
  function nextPath() {
    var next = new URLSearchParams(location.search).get("next");
    if (!next || next.charAt(0) !== "/" || next.charAt(1) === "/" ||
        next.indexOf("\\") !== -1 || /[\u0000-\u001f\u007f]/.test(next)) {
      return "/";
    }
    return next;
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    errorLine.textContent = "";
    button.disabled = true;
    fetch("/api/login", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("username").value,
        password: document.getElementById("password").value
      })
    }).then(function (response) {
      if (response.ok) { location.replace(nextPath()); return; }
      errorLine.textContent = response.status === 401
        ? "Incorrect username or password."
        : "Could not sign in. Please try again.";
      button.disabled = false;
    }).catch(function () {
      errorLine.textContent = "Could not sign in. Please try again.";
      button.disabled = false;
    });
  });
})();
</script>
</body>
</html>
