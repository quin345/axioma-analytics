<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>System status &middot; AXIOMA</title>
<link rel="icon" href="/favicon.png" />
<meta name="theme-color" content="#0b0e12" />
<!--
  Self-contained like login.html: inline CSS/JS, no bundle. Behind the login
  wall; polls /api/status (read-only) every 15 s. Status is always written out
  as text (OK / WARN / DOWN / UNKNOWN / N/A), colour only reinforces it.
-->
<style>
:root{
  --bg:#0b0e12; --panel:#11161d; --card:#151b24; --line:#29323d;
  --fg:#e7edf3; --muted:#94a3b3; --dim:#647587; --accent:#79d9ee; --err:#f0716a;
  --ok:#22d3a7; --warn:#f2c14e; --down:#f0716a; --unknown:#a78bfa;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 "Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding:14px 18px;
  border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0;letter-spacing:.12em}
header .meta{color:var(--muted);font-size:12.5px;flex:1;min-width:200px}
header nav a{color:var(--accent);font-size:12.5px;text-decoration:none;margin-right:12px}
button{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;
  border:1px solid transparent;font-family:inherit;background:var(--accent);color:#04101f}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.6;cursor:default}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:18px 14px 40px}
.banner{display:none;margin:0 0 14px;padding:10px 14px;border:1px solid var(--err);border-radius:8px;
  color:var(--err);background:rgba(240,113,106,.08)}
.overall{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:18px;
  background:var(--card);border:1px solid var(--line);border-radius:10px}
.overall strong{font-size:15px}
section{margin-bottom:20px}
section h2{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 8px}
.items{display:grid;gap:8px}
details.item{background:var(--card);border:1px solid var(--line);border-radius:8px}
details.item summary{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;
  padding:10px 12px;cursor:pointer;list-style:none}
details.item summary::-webkit-details-marker{display:none}
.name{font-weight:600;word-break:break-all}
.detail{grid-column:2;color:var(--muted);font-size:12.5px}
.badge{display:inline-block;min-width:66px;text-align:center;padding:2px 8px;border-radius:6px;
  font-size:11.5px;font-weight:700;letter-spacing:.06em;border:1px solid currentColor}
.s-ok{color:var(--ok)} .s-warn{color:var(--warn)} .s-down{color:var(--down)}
.s-unknown{color:var(--unknown)} .s-na{color:var(--dim)}
dl{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:2px 14px;margin:0;
  padding:4px 12px 12px 12px;font-size:12.5px;border-top:1px solid var(--line)}
dt{color:var(--dim)} dd{margin:0;word-break:break-all;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.empty{color:var(--dim);font-size:12.5px}
.notes{color:var(--dim);font-size:12px}
footer{padding:16px;border-top:1px solid var(--line);background:var(--panel);
  color:var(--dim);font-size:12px;text-align:center}
@media (max-width:560px){
  details.item summary{grid-template-columns:1fr}
  .detail{grid-column:1}
  dl{grid-template-columns:1fr}
  dt{margin-top:4px}
}
</style>
</head>
<body>
<header>
  <h1>AXIOMA &middot; STATUS</h1>
  <div class="meta" aria-live="polite">
    <span id="checked">Checking&hellip;</span>
    <span id="age"></span>
  </div>
  <nav><a href="/terminal/">Terminal</a><a href="/research/">Research</a></nav>
  <button type="button" id="refresh">Refresh</button>
</header>
<main>
  <p class="banner" id="banner" role="alert"></p>
  <div class="overall" id="overall"><span class="badge s-unknown">LOADING</span><strong>Overall</strong></div>
  <div id="sections"></div>
  <p class="notes" id="notes"></p>
</main>
<footer>Read-only. Refreshes every 15 s; the server re-checks at most every 10 s.</footer>

<script>
(function () {
  "use strict";
  var REFRESH_MS = 15000;
  var LABELS = { ok: "OK", warn: "WARN", down: "DOWN", unknown: "UNKNOWN", "n/a": "N/A" };
  var TITLES = [
    ["collectors", "Collectors (depth streams)"],
    ["kql", "KQL database"],
    ["autotraders", "Autotraders"],
    ["cron", "Cron export jobs"],
    ["app", "Web app and dependencies"],
    ["units", "systemd units (ctrader-*)"]
  ];
  var button = document.getElementById("refresh");
  var banner = document.getElementById("banner");
  var lastChecked = null, timer = null;

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }
  function cls(status) { return "badge s-" + (status === "n/a" ? "na" : (LABELS[status] ? status : "unknown")); }
  function badge(status) { return el("span", cls(status), LABELS[status] || "UNKNOWN"); }
  function fmt(value) {
    if (value === null || value === undefined) return "-";
    if (typeof value === "object") return JSON.stringify(value);
    return String(value);
  }
  function card(entry, skip) {
    var details = el("details", "item");
    var summary = el("summary");
    summary.appendChild(badge(entry.status));
    summary.appendChild(el("span", "name", entry.name));
    summary.appendChild(el("span", "detail", entry.detail));
    details.appendChild(summary);
    var list = el("dl");
    Object.keys(entry).forEach(function (key) {
      if (key === "name" || key === "status" || key === "detail" || (skip && skip[key])) return;
      list.appendChild(el("dt", null, key));
      list.appendChild(el("dd", null, fmt(entry[key])));
    });
    details.appendChild(list);
    return details;
  }
  function section(title, entries) {
    var box = el("section");
    box.appendChild(el("h2", null, title));
    var items = el("div", "items");
    if (!entries.length) items.appendChild(el("p", "empty", "Nothing found."));
    entries.forEach(function (entry) { items.appendChild(entry); });
    box.appendChild(items);
    return box;
  }
  function render(data) {
    var overall = document.getElementById("overall");
    overall.textContent = "";
    overall.appendChild(badge(data.overall));
    overall.appendChild(el("strong", null, "Overall: " + (LABELS[data.overall] || "UNKNOWN")));
    var root = document.getElementById("sections");
    root.textContent = "";
    var s = data.sections || {};
    TITLES.forEach(function (pair) {
      var key = pair[0], value = s[key];
      if (value === undefined) return;
      var entries = [];
      if (Array.isArray(value)) {
        value.forEach(function (v) { entries.push(card(v)); });
      } else {
        entries.push(card(value, { streams: 1, jobs: 1, service: 1, sources: 1 }));
        if (value.service) entries.push(card(value.service));
        (value.streams || []).forEach(function (v) { entries.push(card(v)); });
        (value.jobs || []).forEach(function (v) { entries.push(card(v)); });
        if (value.sources) {
          entries.push(card({ name: "cron sources", status: "n/a",
                              detail: value.sources.length + " file(s) checked",
                              files: value.sources }));
        }
      }
      root.appendChild(section(pair[1], entries));
    });
    document.getElementById("notes").textContent =
      (data.notes && data.notes.length) ? "Notes: " + data.notes.join("; ") : "";
    lastChecked = data.checked_at ? new Date(data.checked_at) : null;
    document.getElementById("checked").textContent =
      "Checked at " + (lastChecked ? lastChecked.toISOString().replace("T", " ").slice(0, 19) + " UTC" : "?");
    tick();
  }
  function tick() {
    if (!lastChecked) return;
    var secs = Math.max(0, Math.round((Date.now() - lastChecked.getTime()) / 1000));
    document.getElementById("age").textContent = "(" + secs + " s ago)";
  }
  function load() {
    button.disabled = true;
    fetch("/api/status", { credentials: "same-origin", cache: "no-store" })
      .then(function (response) {
        if (response.status === 401) {
          location.replace("/login?next=" + encodeURIComponent("/status"));
          throw new Error("signed out");
        }
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response.json();
      })
      .then(function (data) {
        banner.style.display = "none";
        render(data);
      })
      .catch(function (error) {
        banner.textContent = "Could not load the status (" + error.message +
          "). Showing the last result; retrying in 15 s.";
        banner.style.display = "block";
      })
      .then(function () {
        button.disabled = false;
        clearTimeout(timer);
        timer = setTimeout(load, REFRESH_MS);
      });
  }
  button.addEventListener("click", load);
  setInterval(tick, 1000);
  load();
})();
</script>
</body>
</html>
